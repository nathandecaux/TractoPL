[project]
name = "TractoPL"
dynamic = ["version"]
description = "Tractometry processing library for diffusion MRI data."
authors = [{ name = "Nathan Decaux" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "antspyx",
  "click",
  "dipy",
  "joblib",
  "matplotlib",
  "nibabel",
  "numpy",
  "pandas",
  "pydicom",
  "scikit-learn",
  "scipy",
  "shapely",
  "SimpleITK",
  "statsmodels",
  "tqdm",
  "vtk",
]

[project.optional-dependencies]
dashboard = ["plotly", "streamlit", "panel", "hvplot", "bokeh"]
tractosearch = ["lpqtree", "tractosearch"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/nathandecaux/TractoPL"
Releases = "https://github.com/nathandecaux/TractoPL/releases"

[project.scripts]
tractopl-apply-trans-to-vtk = "TractoPL.scripts.apply_trans_to_vtk:main"
tractopl-convert-tractogram = "TractoPL.scripts.convert_tractogram:main"
tractopl-frechet-clustering = "TractoPL.atlasing.frechet_clustering:main"
tractopl-generate-centroid = "TractoPL.atlasing.generate_centroid:main"
tractopl-population-analysis = "TractoPL.analysis.population_analysis:main"
tractopl-preprocessing = "TractoPL.pipeline.preprocessing:cli"
tractopl-msmt-csd = "TractoPL.pipeline.msmt_csd:process_subject"
tractopl-mcm = "TractoPL.pipeline.mcm:cli"
tractopl-bundle-seg = "TractoPL.pipeline.bundle_seg:main"
tractopl-tractometry = "TractoPL.pipeline.tractometry:association"
tractopl-connectome = "TractoPL.pipeline.connectome:cli"
tractopl-quickbundle = "TractoPL.scripts.quickbundle:main"
tractosearch_nearest_in_radius = "TractoPL.scripts.tractosearch_nearest_in_radius:main"
tractopl-report-analysis = "TractoPL.analysis.population_analysis_report:main"
tractopl-gui = "TractoPL.dashboard.apps:home"
tractopl-gui-pipeline = "TractoPL.dashboard.apps:pipeline"
tractopl-gui-analysis = "TractoPL.dashboard.apps:analysis"
tractopl-gui-dashboard = "TractoPL.dashboard.apps:dashboard"
tractopl-gui-report = "TractoPL.dashboard.apps:report"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "TractoPL._version.__version__" }

[tool.setuptools.packages.find]
include = ["TractoPL*"]
namespaces = false

[tool.setuptools.package-data]
"TractoPL" = ["config_profiles/*.json"]
"TractoPL.analysis" = ["*.json", "*.md", "*.jinja2"]

[tool.setuptools.exclude-package-data]
"TractoPL" = ["config_profiles/my_atlas_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# pixi: development environments, tasks and the conda package.
#   pixi run test                 -> tests
#   pixi run -e dashboard gui     -> web applications
#   pixi run release patch        -> bump + tag + push (the CI publishes)
#   pixi publish --target-dir dist/conda   -> build the .conda package locally
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
name = "TractoPL"
channels = ["conda-forge"]
# antspyx wheels for osx-arm64 need macOS >= 14
platforms = ["linux-64", "osx-64", { name = "osx-arm64-macos14", subdir = "osx-arm64", macos = "14.0" }]
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
click = "*"
dipy = "*"
joblib = "*"
matplotlib-base = "*"
nibabel = "*"
numpy = "<2.4"    # antspyx 0.6.3 requires numpy<2.4
pandas = "*"
pydicom = "*"
scikit-learn = "*"
scipy = "<1.16"   # antspyx 0.6.3 requires scipy<1.16
shapely = "*"
simpleitk = "*"
statsmodels = "*"
tqdm = "*"
vtk-base = "*"

[tool.pixi.pypi-dependencies]
antspyx = "*"   # from PyPI: conda-forge only builds it for linux-64 and osx-64
TractoPL = { path = ".", editable = true }

# antspyx: conda-forge builds it for linux-64 and osx-64 only -> PyPI wheel on osx-arm64
[tool.pixi.target.linux-64.dependencies]
antspyx = ">=0.6.3"

[tool.pixi.target.osx-64.dependencies]
antspyx = ">=0.6.3"

[tool.pixi.target.osx-arm64.pypi-dependencies]
antspyx = ">=0.6.3"

[tool.pixi.feature.dashboard.dependencies]
plotly = "*"
streamlit = "*"
panel = "*"
hvplot = "*"
bokeh = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.build.dependencies]
python-build = "*"
pip = "*"

[tool.pixi.feature.release.dependencies]
python = ">=3.10"

[tool.pixi.environments]
default = { features = ["dashboard"], solve-group = "default" }
test = { features = ["dashboard", "test"], solve-group = "default" }
build = { features = ["build"], no-default-feature = true }
release = { features = ["release"], no-default-feature = true }

[tool.pixi.tasks]
test = "python -m pytest -q tests"
gui = "tractopl-gui"

[tool.pixi.feature.release.tasks]
version = "python packaging/bump_version.py"
release = "bash packaging/release.sh"

[tool.pixi.feature.build.tasks]
wheel = "python -m build --outdir dist ."

# Conda package (noarch python), built with `pixi publish`.
[tool.pixi.package]
name = "tractopl"
version = "0.1.1"  # kept in sync with TractoPL/_version.py by packaging/bump_version.py

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "0.*"
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.package.host-dependencies]
python = ">=3.10"
setuptools = ">=61"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.10"
antspyx = "*"   # conda-forge: linux-64 and osx-64 only (on osx-arm64, use pip or the pixi workspace)
click = "*"
dipy = "*"
joblib = "*"
matplotlib-base = "*"
nibabel = "*"
numpy = "*"
pandas = "*"
pydicom = "*"
scikit-learn = "*"
scipy = "*"
shapely = "*"
simpleitk = "*"
statsmodels = "*"
tqdm = "*"
vtk-base = "*"
